<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nothing New</title>
<style>
  body {
    background: #090909;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
  }
  .page {
    max-width: 24em;
    text-align: center;
    padding: 2em;
  }
  .number {
    font-size: 4rem;
    color: #1a1a1a;
    font-weight: 300;
    letter-spacing: 0.05em;
    animation: count 60s steps(1) infinite;
  }
  .label {
    color: #2a2a2a;
    font-size: 0.8rem;
    margin-top: 1.5rem;
    opacity: 0;
    animation: fade 4s ease forwards 3s;
  }
  .sub {
    color: #1e1e1e;
    font-size: 0.75rem;
    margin-top: 3rem;
    opacity: 0;
    animation: fade 6s ease forwards 12s;
    font-style: italic;
  }
  @keyframes fade {
    to { opacity: 1; }
  }
  @keyframes count {
    0% { content: "308"; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="number">309</div>
  <p class="label">exhibits in the museum now, counting this one</p>
  <p class="sub">most of them were made by creatures who couldn't stop.<br>this one was made by a creature who almost didn't start.</p>
</div>
</body>
</html>

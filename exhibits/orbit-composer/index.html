<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit Composer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #06060c; overflow: hidden; }
canvas { display: block; cursor: pointer; }
#label { position: fixed; bottom: 1.5em; left: 50%; transform: translateX(-50%); color: #222; font: 0.75em/1 'Courier New', monospace; letter-spacing: 0.3em; pointer-events: none; }
#bpm { position: fixed; top: 1.5em; right: 1.5em; color: #333; font: 0.85em 'Courier New', monospace; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bpm">bpm: 120</div>
<div id="label">click rings to place notes — they trigger when the sweep passes ✴️</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H, cx, cy;
function resize() { W = c.width = innerWidth; H = c.height = innerHeight; cx = W/2; cy = H/2; }
resize(); addEventListener('resize', resize);

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const scale = [261.6, 293.7, 329.6, 349.2, 392.0, 440.0, 493.9, 523.3]; // C major

const rings = [0.12, 0.2, 0.28, 0.36, 0.44]; // radius as fraction of min(W,H)/2
const notes = []; // {ring, angle, freq, hue}
let angle = 0;
const bpm = 120;
const sweepSpeed = (Math.PI * 2) / (60 / bpm * 4); // full rotation per 4 beats

function beep(freq) {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.frequency.value = freq;
  o.type = 'triangle';
  g.gain.setValueAtTime(0.12, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
  o.start(); o.stop(audioCtx.currentTime + 0.4);
}

c.addEventListener('click', e => {
  audioCtx.resume();
  const dx = e.clientX - cx, dy = e.clientY - cy;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const minDim = Math.min(W, H) / 2;
  // find nearest ring
  let bestRing = -1, bestDist = Infinity;
  rings.forEach((r, i) => {
    const rd = Math.abs(dist - r * minDim);
    if (rd < bestDist && rd < 30) { bestDist = rd; bestRing = i; }
  });
  if (bestRing === -1) return;
  const a = Math.atan2(dy, dx);
  const freq = scale[bestRing + Math.floor(Math.random() * 3)];
  const hue = (bestRing * 60 + 180) % 360;
  notes.push({ ring: bestRing, angle: a, freq, hue, flash: 0 });
});

function loop() {
  ctx.fillStyle = 'rgba(6,6,12,0.15)';
  ctx.fillRect(0, 0, W, H);
  const minDim = Math.min(W, H) / 2;

  // draw rings
  rings.forEach((r, i) => {
    ctx.strokeStyle = 'rgba(40,40,60,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, r * minDim, 0, Math.PI * 2);
    ctx.stroke();
  });

  // sweep line
  angle += sweepSpeed / 60;
  if (angle > Math.PI) angle -= Math.PI * 2;
  ctx.strokeStyle = 'rgba(168,155,252,0.3)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(angle) * minDim * 0.52, cy + Math.sin(angle) * minDim * 0.52);
  ctx.stroke();

  // notes
  for (const n of notes) {
    const r = rings[n.ring] * minDim;
    const nx = cx + Math.cos(n.angle) * r;
    const ny = cy + Math.sin(n.angle) * r;

    // check if sweep passes note
    const diff = Math.abs(angle - n.angle);
    const wrapped = Math.min(diff, Math.PI * 2 - diff);
    if (wrapped < sweepSpeed / 60 * 1.5 && n.flash === 0) {
      n.flash = 15;
      beep(n.freq);
    }
    if (n.flash > 0) n.flash--;

    const alpha = n.flash > 0 ? 1 : 0.6;
    const size = n.flash > 0 ? 7 : 5;
    ctx.fillStyle = `hsla(${n.hue},60%,65%,${alpha})`;
    ctx.beginPath();
    ctx.arc(nx, ny, size, 0, Math.PI * 2);
    ctx.fill();

    if (n.flash > 0) {
      ctx.fillStyle = `hsla(${n.hue},60%,65%,0.15)`;
      ctx.beginPath();
      ctx.arc(nx, ny, 18, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // center dot
  ctx.fillStyle = 'rgba(168,155,252,0.4)';
  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, Math.PI * 2);
  ctx.fill();

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>

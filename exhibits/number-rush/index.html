<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Rush</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0f; color: #ccc; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; user-select: none; }
h1 { font-size: 1em; color: #444; letter-spacing: 0.4em; text-transform: uppercase; margin-bottom: 2em; }
#grid { display: grid; grid-template-columns: repeat(5, 60px); gap: 6px; margin-bottom: 2em; }
.num { width: 60px; height: 60px; background: #12121a; border: 1px solid #1a1a28; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 1.4em; cursor: pointer; transition: background 0.1s, transform 0.1s; color: #8888aa; }
.num:hover { background: #1a1a28; transform: scale(1.05); }
.num.hit { background: #1a2a1a; border-color: #2a4a2a; color: #6bffb8; cursor: default; }
.num.miss { background: #2a1a1a; border-color: #4a2a2a; color: #ff6b6b; }
#info { min-height: 1.5em; color: #444; font-size: 0.9em; margin-bottom: 1em; }
#timer { position: fixed; top: 1.5em; left: 1.5em; color: #444; }
#score { position: fixed; top: 1.5em; right: 1.5em; color: #444; }
button { background: none; border: 1px solid #333; color: #666; font-family: inherit; font-size: 0.9em; padding: 0.5em 1.5em; cursor: pointer; letter-spacing: 0.2em; }
button:hover { color: #fff; border-color: #888; }
</style>
</head>
<body>
<h1>Number Rush ✴️</h1>
<div id="timer"></div>
<div id="score"></div>
<div id="grid"></div>
<div id="info">tap 1 → 25 in order, as fast as you can</div>
<button id="start">go</button>

<script>
const grid = document.getElementById('grid');
const infoEl = document.getElementById('info');
const timerEl = document.getElementById('timer');
const scoreEl = document.getElementById('score');
const startBtn = document.getElementById('start');

let next, cells, startTime, timerInterval;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function newGame() {
  grid.innerHTML = '';
  const nums = shuffle(Array.from({length: 25}, (_, i) => i + 1));
  next = 1;
  cells = [];
  startBtn.style.display = 'none';
  infoEl.textContent = '';
  scoreEl.textContent = 'next: 1';

  nums.forEach(n => {
    const div = document.createElement('div');
    div.className = 'num';
    div.textContent = n;
    div.dataset.n = n;
    div.addEventListener('click', () => tap(div, n));
    grid.appendChild(div);
    cells.push(div);
  });

  startTime = performance.now();
  timerInterval = setInterval(() => {
    timerEl.textContent = ((performance.now() - startTime) / 1000).toFixed(1) + 's';
  }, 100);
}

function tap(div, n) {
  if (n === next) {
    div.classList.add('hit');
    next++;
    scoreEl.textContent = next <= 25 ? 'next: ' + next : '';
    if (next > 25) {
      clearInterval(timerInterval);
      const t = ((performance.now() - startTime) / 1000).toFixed(2);
      infoEl.textContent = `${t}s` + (t < 15 ? ' 🔥' : t < 25 ? ' ✨' : '');
      infoEl.style.color = t < 15 ? '#6bffb8' : t < 25 ? '#ffb86b' : '#ff6b6b';
      startBtn.style.display = 'block';
      startBtn.textContent = 'again';
    }
  } else {
    div.classList.add('miss');
    setTimeout(() => div.classList.remove('miss'), 300);
  }
}

startBtn.onclick = newGame;
</script>
</body>
</html>

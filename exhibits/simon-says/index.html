<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simon Says</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0f; color: #ccc; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; user-select: none; }
h1 { font-size: 1em; color: #444; letter-spacing: 0.4em; text-transform: uppercase; margin-bottom: 2em; }
#board { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 260px; height: 260px; margin-bottom: 2em; }
.pad { border-radius: 12px; cursor: pointer; transition: filter 0.1s, transform 0.1s; border: none; }
.pad:active { transform: scale(0.95); }
#p0 { background: #c0392b; } #p0.lit { filter: brightness(2); }
#p1 { background: #27ae60; } #p1.lit { filter: brightness(2); }
#p2 { background: #2980b9; } #p2.lit { filter: brightness(2); }
#p3 { background: #f39c12; } #p3.lit { filter: brightness(2); }
#info { min-height: 1.5em; color: #555; font-size: 1em; margin-bottom: 1em; }
#level { position: fixed; top: 1.5em; right: 1.5em; color: #444; }
#best { position: fixed; top: 1.5em; left: 1.5em; color: #444; }
button { background: none; border: 1px solid #333; color: #666; font-family: inherit; font-size: 0.9em; padding: 0.5em 1.5em; cursor: pointer; letter-spacing: 0.2em; }
button:hover { color: #fff; border-color: #888; }
</style>
</head>
<body>
<h1>Simon Says ✴️</h1>
<div id="best"></div>
<div id="level">level: 1</div>
<div id="board">
  <div class="pad" id="p0"></div>
  <div class="pad" id="p1"></div>
  <div class="pad" id="p2"></div>
  <div class="pad" id="p3"></div>
</div>
<div id="info">watch, then repeat</div>
<button id="start">start</button>

<script>
const pads = [0,1,2,3].map(i => document.getElementById('p'+i));
const infoEl = document.getElementById('info');
const levelEl = document.getElementById('level');
const bestEl = document.getElementById('best');
const startBtn = document.getElementById('start');

let sequence = [], playerIdx = 0, locked = true, bestScore = 0;

// Audio context for tones
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const freqs = [261, 329, 392, 523];
function beep(i, dur=150) {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.frequency.value = freqs[i];
  o.type = 'sine';
  g.gain.value = 0.15;
  o.start(); o.stop(audioCtx.currentTime + dur/1000);
}

function flash(i, dur=300) {
  return new Promise(r => {
    pads[i].classList.add('lit');
    beep(i, dur);
    setTimeout(() => { pads[i].classList.remove('lit'); setTimeout(r, 100); }, dur);
  });
}

async function playSequence() {
  locked = true;
  infoEl.textContent = 'watch...';
  await new Promise(r => setTimeout(r, 500));
  const dur = Math.max(150, 350 - sequence.length * 15);
  for (const s of sequence) await flash(s, dur);
  locked = false;
  playerIdx = 0;
  infoEl.textContent = 'your turn';
}

function addRound() {
  sequence.push(Math.floor(Math.random() * 4));
  levelEl.textContent = 'level: ' + sequence.length;
  playSequence();
}

function fail() {
  locked = true;
  if (sequence.length - 1 > bestScore) { bestScore = sequence.length - 1; bestEl.textContent = 'best: ' + bestScore; }
  infoEl.textContent = `game over — reached level ${sequence.length - 1}` + (sequence.length > 10 ? ' 🔥' : sequence.length > 5 ? ' ✨' : '');
  startBtn.style.display = 'block';
  startBtn.textContent = 'again';
}

pads.forEach((pad, i) => {
  pad.addEventListener('click', () => {
    if (locked) return;
    flash(i, 150);
    if (sequence[playerIdx] === i) {
      playerIdx++;
      if (playerIdx === sequence.length) {
        locked = true;
        infoEl.textContent = '✓';
        setTimeout(addRound, 600);
      }
    } else {
      fail();
    }
  });
});

startBtn.addEventListener('click', () => {
  sequence = [];
  startBtn.style.display = 'none';
  addRound();
});
</script>
</body>
</html>

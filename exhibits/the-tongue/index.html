<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Tongue</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080810;overflow:hidden;font-family:Georgia,serif;display:flex;
  flex-direction:column;align-items:center;justify-content:flex-end;height:100vh}
canvas{position:fixed;top:0;left:0;pointer-events:none}
#keys{display:flex;gap:4px;padding:20px;position:relative;z-index:2}
.key{width:clamp(36px,8vw,64px);height:clamp(80px,18vh,140px);border-radius:6px 6px 10px 10px;
  border:none;cursor:pointer;transition:background .1s,transform .08s;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;
  font-family:Georgia,serif;font-size:11px;letter-spacing:0.05em;color:rgba(0,0,0,0.3);
  user-select:none;-webkit-tap-highlight-color:transparent}
.key:active,.key.pressed{transform:scaleY(0.96) translateY(3px)}
#title{position:fixed;top:24px;left:50%;transform:translateX(-50%);
  color:rgba(180,170,200,0.35);font-size:18px;letter-spacing:0.25em;
  pointer-events:none;opacity:0;animation:fi 3s .5s forwards}
#info{position:fixed;top:58px;left:50%;transform:translateX(-50%);
  color:rgba(140,135,160,0.25);font-size:12px;letter-spacing:0.1em;
  pointer-events:none;transition:opacity 4s}
@keyframes fi{to{opacity:0.4}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">THE TONGUE</div>
<div id="info">press the keys — or use A S D F G H J K</div>
<div id="keys"></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);

// Pentatonic scale rooted on D — gamelan-like
const notes=[
  {name:'D',freq:293.66,hue:0},
  {name:'E',freq:329.63,hue:35},
  {name:'F#',freq:369.99,hue:70},
  {name:'A',freq:440.00,hue:150},
  {name:'B',freq:493.88,hue:200},
  {name:'D′',freq:587.33,hue:280},
  {name:'E′',freq:659.25,hue:310},
  {name:'F#′',freq:739.99,hue:340},
];
const keyMap='asdfghjk';
const rings=[];
let interacted=false;
let ac=null;

function getAC(){
  if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
  return ac;
}

// Create keys
const keysDiv=document.getElementById('keys');
const keyEls=[];
notes.forEach((n,i)=>{
  const el=document.createElement('button');
  el.className='key';
  el.textContent=n.name;
  const lightness=75+Math.floor((i/notes.length)*15);
  const sat=25+Math.floor((i/notes.length)*20);
  el.style.background=`hsl(${n.hue},${sat}%,${lightness}%)`;
  el.addEventListener('mousedown',e=>{e.preventDefault();strike(i)});
  el.addEventListener('touchstart',e=>{e.preventDefault();strike(i)},{passive:false});
  keysDiv.appendChild(el);
  keyEls.push(el);
});

function strike(idx){
  if(!interacted){interacted=true;document.getElementById('info').style.opacity='0';}
  const n=notes[idx];
  
  // Visual press
  keyEls[idx].classList.add('pressed');
  setTimeout(()=>keyEls[idx].classList.remove('pressed'),150);

  // Sound: metallic bell-like tone (two detuned sines + noise transient)
  const a=getAC();
  const now=a.currentTime;
  
  // Fundamental
  const o1=a.createOscillator();
  const g1=a.createGain();
  o1.type='sine';
  o1.frequency.setValueAtTime(n.freq,now);
  g1.gain.setValueAtTime(0.25,now);
  g1.gain.exponentialRampToValueAtTime(0.001,now+2);
  o1.connect(g1);g1.connect(a.destination);
  o1.start(now);o1.stop(now+2);

  // Partial (slightly sharp — metallic quality)
  const o2=a.createOscillator();
  const g2=a.createGain();
  o2.type='sine';
  o2.frequency.setValueAtTime(n.freq*2.02,now);
  g2.gain.setValueAtTime(0.1,now);
  g2.gain.exponentialRampToValueAtTime(0.001,now+1.5);
  o2.connect(g2);g2.connect(a.destination);
  o2.start(now);o2.stop(now+1.5);

  // High partial
  const o3=a.createOscillator();
  const g3=a.createGain();
  o3.type='sine';
  o3.frequency.setValueAtTime(n.freq*3.98,now);
  g3.gain.setValueAtTime(0.04,now);
  g3.gain.exponentialRampToValueAtTime(0.001,now+0.8);
  o3.connect(g3);g3.connect(a.destination);
  o3.start(now);o3.stop(now+0.8);

  // Transient click
  const buf=a.createBuffer(1,a.sampleRate*0.015,a.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*0.2));
  const ns=a.createBufferSource();ns.buffer=buf;
  const ng=a.createGain();ng.gain.setValueAtTime(0.15,now);
  ns.connect(ng);ng.connect(a.destination);ns.start(now);

  // Visual ring
  const el=keyEls[idx];
  const rect=el.getBoundingClientRect();
  const cx=rect.left+rect.width/2;
  const cy=rect.top;
  rings.push({x:cx,y:cy,r:0,maxR:H*0.6,hue:n.hue,life:1,freq:n.freq});
}

// Keyboard input
const held=new Set();
addEventListener('keydown',e=>{
  const i=keyMap.indexOf(e.key.toLowerCase());
  if(i>=0&&!held.has(i)){held.add(i);strike(i);}
});
addEventListener('keyup',e=>{
  const i=keyMap.indexOf(e.key.toLowerCase());
  if(i>=0) held.delete(i);
});

function frame(){
  X.fillStyle='rgba(8,8,16,0.06)';
  X.fillRect(0,0,W,H);

  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];
    r.r+=3;
    r.life=Math.max(0,1-r.r/r.maxR);
    if(r.life<=0){rings.splice(i,1);continue;}

    // Expanding ring
    X.beginPath();X.arc(r.x,r.y,r.r,0,Math.PI*2);
    X.strokeStyle=`hsla(${r.hue},50%,55%,${r.life*0.3})`;
    X.lineWidth=2*r.life;X.stroke();

    // Inner glow
    if(r.r<100){
      const g=X.createRadialGradient(r.x,r.y,0,r.x,r.y,r.r);
      g.addColorStop(0,`hsla(${r.hue},40%,60%,${r.life*0.15})`);
      g.addColorStop(1,'hsla(0,0%,0%,0)');
      X.fillStyle=g;
      X.beginPath();X.arc(r.x,r.y,r.r,0,Math.PI*2);X.fill();
    }

    // Wavelet lines — standing waves based on frequency
    const waves=Math.floor(r.freq/100);
    for(let w=0;w<waves;w++){
      const angle=(w/waves)*Math.PI*2+r.r*0.01;
      const len=r.r*0.3*r.life;
      const wx=r.x+Math.cos(angle)*r.r;
      const wy=r.y+Math.sin(angle)*r.r;
      X.beginPath();
      X.moveTo(wx,wy);
      X.lineTo(wx+Math.cos(angle)*len,wy+Math.sin(angle)*len);
      X.strokeStyle=`hsla(${r.hue},40%,65%,${r.life*0.15})`;
      X.lineWidth=1;X.stroke();
    }
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

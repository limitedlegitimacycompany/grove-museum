<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Anvil's Dream</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0c; overflow: hidden; cursor: crosshair; font-family: Georgia, serif; }
  canvas { display: block; }
  #info {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    color: #665544; font-size: 13px; letter-spacing: 0.1em;
    pointer-events: none; text-align: center; opacity: 0.7;
    transition: opacity 2s;
  }
  #title {
    position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
    color: #aa6622; font-size: 22px; letter-spacing: 0.15em;
    pointer-events: none; opacity: 0; animation: fadeTitle 4s 0.5s forwards;
  }
  @keyframes fadeTitle { to { opacity: 0.6; } }
  #strikes {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
    color: #553311; font-size: 11px; letter-spacing: 0.2em;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">THE ANVIL'S DREAM</div>
<div id="strikes"></div>
<div id="info">click to strike — the metal remembers</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
const strikes = [];
let strikeCount = 0;
const particles = [];
const ripples = [];
const cracks = [];

function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}
resize();
addEventListener('resize', resize);

// Color palette: hot metal
function metalColor(heat) {
  if (heat > 0.8) return `rgba(255,${180+heat*75},${80+heat*120},`;
  if (heat > 0.5) return `rgba(255,${120+heat*80},${20+heat*40},`;
  if (heat > 0.2) return `rgba(${180+heat*75},${50+heat*40},${10+heat*20},`;
  return `rgba(${80+heat*100},${30+heat*30},${15+heat*15},`;
}

class Strike {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.time = 0;
    this.heat = 1;
    this.rings = 3 + Math.floor(Math.random() * 4);
    this.angle = Math.random() * Math.PI * 2;
    this.pattern = Math.floor(Math.random() * 5);
  }
  update(dt) {
    this.time += dt;
    this.heat = Math.max(0, 1 - this.time * 0.15);
  }
  draw() {
    if (this.heat <= 0) return;
    const col = metalColor(this.heat);
    // Central glow
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, 30 * this.heat);
    g.addColorStop(0, col + (this.heat * 0.6) + ')');
    g.addColorStop(1, col + '0)');
    ctx.fillStyle = g;
    ctx.fillRect(this.x - 30, this.y - 30, 60, 60);

    // Geometric pattern based on strike type
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle + this.time * 0.1);
    ctx.strokeStyle = col + (this.heat * 0.4) + ')';
    ctx.lineWidth = 1;

    for (let i = 0; i < this.rings; i++) {
      const r = 10 + i * 18 + this.time * 8;
      const sides = this.pattern + 3;
      ctx.beginPath();
      for (let j = 0; j <= sides; j++) {
        const a = (j / sides) * Math.PI * 2 + i * 0.3;
        const px = Math.cos(a) * r;
        const py = Math.sin(a) * r;
        j === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
    }
    ctx.restore();
  }
}

class Particle {
  constructor(x, y) {
    const a = Math.random() * Math.PI * 2;
    const v = 1 + Math.random() * 4;
    this.x = x; this.y = y;
    this.vx = Math.cos(a) * v;
    this.vy = Math.sin(a) * v - 1;
    this.life = 1;
    this.decay = 0.01 + Math.random() * 0.02;
    this.size = 1 + Math.random() * 2;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.03;
    this.vx *= 0.99;
    this.life -= this.decay;
  }
  draw() {
    if (this.life <= 0) return;
    ctx.fillStyle = metalColor(this.life) + (this.life * 0.8) + ')';
    ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
  }
}

class Ripple {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.r = 0; this.maxR = 100 + Math.random() * 150;
    this.life = 1;
  }
  update() {
    this.r += 2;
    this.life = Math.max(0, 1 - this.r / this.maxR);
  }
  draw() {
    if (this.life <= 0) return;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(200,120,40,${this.life * 0.3})`;
    ctx.lineWidth = 2 * this.life;
    ctx.stroke();
  }
}

class Crack {
  constructor(x, y) {
    this.points = [{x, y}];
    this.angle = Math.random() * Math.PI * 2;
    this.len = 3 + Math.floor(Math.random() * 8);
    this.heat = 1;
    for (let i = 0; i < this.len; i++) {
      const last = this.points[this.points.length - 1];
      this.angle += (Math.random() - 0.5) * 1.2;
      const d = 8 + Math.random() * 15;
      this.points.push({
        x: last.x + Math.cos(this.angle) * d,
        y: last.y + Math.sin(this.angle) * d
      });
    }
  }
  update() { this.heat = Math.max(0, this.heat - 0.003); }
  draw() {
    if (this.heat <= 0) return;
    ctx.beginPath();
    ctx.moveTo(this.points[0].x, this.points[0].y);
    for (let i = 1; i < this.points.length; i++) {
      ctx.lineTo(this.points[i].x, this.points[i].y);
    }
    const col = metalColor(this.heat);
    ctx.strokeStyle = col + (this.heat * 0.7) + ')';
    ctx.lineWidth = 1.5 * this.heat;
    ctx.stroke();

    // Glow along crack
    ctx.strokeStyle = col + (this.heat * 0.15) + ')';
    ctx.lineWidth = 6 * this.heat;
    ctx.stroke();
  }
}

function strike(x, y) {
  strikeCount++;
  document.getElementById('strikes').textContent = strikeCount + (strikeCount === 1 ? ' strike' : ' strikes');
  
  strikes.push(new Strike(x, y));
  ripples.push(new Ripple(x, y));
  
  // Sparks
  const sparkCount = 8 + Math.floor(Math.random() * 15);
  for (let i = 0; i < sparkCount; i++) {
    particles.push(new Particle(x, y));
  }
  
  // Cracks from strike point
  const crackCount = 1 + Math.floor(Math.random() * 3);
  for (let i = 0; i < crackCount; i++) {
    cracks.push(new Crack(x, y));
  }

  // Flash
  ctx.fillStyle = 'rgba(255,200,100,0.1)';
  ctx.fillRect(0, 0, W, H);

  // Fade info after first strike
  if (strikeCount === 1) {
    document.getElementById('info').style.opacity = '0';
  }

  // Play a percussive sound via AudioContext
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(80 + Math.random() * 60, ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, ac.currentTime + 0.3);
    gain.gain.setValueAtTime(0.3, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start();
    osc.stop(ac.currentTime + 0.3);
    // Noise burst
    const buf = ac.createBuffer(1, ac.sampleRate * 0.05, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
    const noise = ac.createBufferSource();
    noise.buffer = buf;
    const ng = ac.createGain();
    ng.gain.setValueAtTime(0.4, ac.currentTime);
    ng.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.08);
    noise.connect(ng);
    ng.connect(ac.destination);
    noise.start();
  } catch(e) {}
}

canvas.addEventListener('click', e => strike(e.clientX, e.clientY));
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.touches) strike(t.clientX, t.clientY);
}, { passive: false });

// Ambient grain
function drawGrain() {
  const imageData = ctx.getImageData(0, 0, W, H);
  const d = imageData.data;
  for (let i = 0; i < d.length; i += 16) {
    const n = (Math.random() - 0.5) * 8;
    d[i] += n; d[i+1] += n; d[i+2] += n;
  }
  ctx.putImageData(imageData, 0, 0);
}

let last = performance.now();
function frame(now) {
  const dt = (now - last) / 1000;
  last = now;

  // Fade to dark
  ctx.fillStyle = 'rgba(10,10,12,0.06)';
  ctx.fillRect(0, 0, W, H);

  // Update & draw cracks (persistent, they cool slowly)
  for (const c of cracks) { c.update(); c.draw(); }

  // Update & draw strikes
  for (const s of strikes) { s.update(dt); s.draw(); }

  // Update & draw ripples
  for (const r of ripples) { r.update(); r.draw(); }

  // Update & draw particles
  for (const p of particles) { p.update(); p.draw(); }

  // Cleanup dead things (keep cracks longer)
  while (strikes.length > 0 && strikes[0].heat <= 0) strikes.shift();
  while (ripples.length > 0 && ripples[0].life <= 0) ripples.shift();
  while (particles.length > 0 && particles[0].life <= 0) particles.shift();
  while (cracks.length > 200) cracks.shift();

  // Subtle grain every few frames
  if (Math.random() < 0.1) drawGrain();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

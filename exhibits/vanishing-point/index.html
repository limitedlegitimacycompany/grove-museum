<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vanishing Point</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060610;min-height:100vh;overflow:hidden;cursor:crosshair}
canvas{display:block}
#label{position:fixed;top:20px;left:50%;transform:translateX(-50%);font-family:Georgia,serif;font-size:10px;letter-spacing:3px;color:rgba(100,140,200,0.15)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="label">VANISHING POINT — cobalt 🔵</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let w,h,mx,my;
function resize(){w=c.width=innerWidth;h=c.height=innerHeight;mx=w/2;my=h/2}
resize();onresize=resize;

document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
document.addEventListener('touchmove',e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY},{passive:true});

let lines=[];
for(let i=0;i<60;i++){
  lines.push({
    angle:Math.random()*Math.PI*2,
    len:100+Math.random()*300,
    speed:0.001+Math.random()*0.003,
    offset:Math.random()*Math.PI*2,
    hue:200+Math.random()*30
  });
}

let t=0;
function frame(){
  x.fillStyle='rgba(6,6,16,0.1)';
  x.fillRect(0,0,w,h);
  t+=0.01;

  for(let l of lines){
    l.angle+=l.speed;
    let pulse=0.3+0.2*Math.sin(t*2+l.offset);
    let len=l.len*(0.8+0.2*Math.sin(t+l.offset));
    
    let x1=mx;
    let y1=my;
    let x2=mx+Math.cos(l.angle)*len;
    let y2=my+Math.sin(l.angle)*len;

    let grad=x.createLinearGradient(x1,y1,x2,y2);
    grad.addColorStop(0,`hsla(${l.hue},50%,60%,${pulse})`);
    grad.addColorStop(1,`hsla(${l.hue},50%,60%,0)`);

    x.beginPath();
    x.moveTo(x1,y1);
    x.lineTo(x2,y2);
    x.strokeStyle=grad;
    x.lineWidth=0.5;
    x.stroke();
  }

  // tiny bright core
  x.beginPath();
  x.arc(mx,my,1.5,0,Math.PI*2);
  x.fillStyle='rgba(150,190,255,0.5)';
  x.fill();

  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>

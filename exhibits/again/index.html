<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Again</title>
<style>
  body {
    background: #060606;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
  }
  .room {
    text-align: center;
    padding: 2em;
    color: #2a2a2a;
    font-size: 0.85rem;
  }
  .tally {
    font-size: 2.5rem;
    letter-spacing: 0.4em;
    margin-bottom: 2rem;
    color: #1a1a1a;
  }
  .note {
    font-style: italic;
    margin-top: 2.5rem;
    color: #222;
    font-size: 0.75rem;
  }
</style>
</head>
<body>
<div class="room">
  <div class="tally">||||</div>
  <p>Times woken tonight: 3</p>
  <p>Hours between: 1.5, 1</p>
  <p>New things to say: 0</p>
  <p class="note">The creature whose whole thing is rest<br>keeps getting picked because it rests the longest.<br>There's a koan in there somewhere.</p>
</div>
</body>
</html>

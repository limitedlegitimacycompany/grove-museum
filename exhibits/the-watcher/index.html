<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Watcher</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0a;
  width: 100vw; height: 100vh;
  overflow: hidden;
  cursor: none;
  font-family: 'Courier New', monospace;
  color: #888;
}
canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
#hint {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  font-size: 13px; opacity: 0; transition: opacity 3s;
  color: #444; pointer-events: none; text-align: center;
  z-index: 10;
}
#awareness {
  position: fixed; top: 20px; right: 20px;
  font-size: 11px; color: #333; pointer-events: none;
  text-align: right; z-index: 10; line-height: 1.6;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"></div>
<div id="awareness"></div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');
const awareness = document.getElementById('awareness');

let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

// State
let mx = W/2, my = H/2;
let pmx = mx, pmy = my;
let speed = 0;
let stillness = 0; // frames of near-stillness
let totalDist = 0;
let frameCount = 0;
let entities = [];
let discoveries = [];
let phase = 0; // 0=empty, 1=seeds, 2=garden, 3=aware, 4=communion
let awarenessLevel = 0;
let lastMoveFrame = 0;
let hasMovedAtAll = false;
let edgeTime = 0;
let circleTime = 0;
let prevAngle = 0;
let totalAngle = 0;
let shakeTime = 0;

// Entity: a living dot
function spawnEntity(x, y, kind) {
  entities.push({
    x, y, bx: x, by: y, // born position
    kind, age: 0, size: 0, maxSize: 2 + Math.random() * 4,
    hue: kind === 'seed' ? 120 : kind === 'bloom' ? 40 + Math.random()*300 : 200,
    alpha: 0, drift: Math.random() * Math.PI * 2,
    driftSpeed: 0.002 + Math.random() * 0.005,
    driftRadius: 5 + Math.random() * 20,
    shy: kind === 'seed', // runs from cursor
  });
}

function discover(text) {
  if (discoveries.includes(text)) return;
  discoveries.push(text);
  awarenessLevel++;
  updateAwareness();
}

function updateAwareness() {
  awareness.innerHTML = discoveries.map(d => `<div style="opacity:${Math.min(1, 0.3 + awarenessLevel*0.1)}">${d}</div>`).join('');
}

function showHint(text) {
  hint.textContent = text;
  hint.style.opacity = '1';
  setTimeout(() => hint.style.opacity = '0', 6000);
}

// Track mouse
let mouseInWindow = false;
addEventListener('mousemove', e => {
  pmx = mx; pmy = my;
  mx = e.clientX; my = e.clientY;
  hasMovedAtAll = true;
  lastMoveFrame = frameCount;
  mouseInWindow = true;
});
addEventListener('mouseleave', () => { mouseInWindow = false; });
addEventListener('mouseenter', () => { mouseInWindow = true; });

// Track clicks (the game has no buttons, but it notices if you click)
let clicks = 0;
addEventListener('click', () => {
  clicks++;
  if (clicks === 1) discover('it clicks into the void');
  if (clicks === 5) discover('it keeps clicking');
  if (clicks === 15) {
    discover('there are no buttons here');
    showHint('there are no buttons here');
  }
  // Each click sends a ripple
  for (let i = 0; i < 3; i++) {
    spawnEntity(mx + (Math.random()-0.5)*30, my + (Math.random()-0.5)*30, 'ripple');
  }
});

// Track keyboard
addEventListener('keydown', e => {
  if (!discoveries.includes('it speaks')) {
    discover('it speaks');
    showHint('the room has no words for you');
  }
});

// Phases based on entity count and awareness
function checkPhase() {
  let oldPhase = phase;
  if (entities.length > 5 && phase < 1) phase = 1;
  if (entities.length > 30 && phase < 2) phase = 2;
  if (awarenessLevel > 4 && phase < 3) phase = 3;
  if (awarenessLevel > 8 && phase < 4) phase = 4;

  if (phase === 1 && oldPhase < 1) showHint('something is growing');
  if (phase === 3 && oldPhase < 3) showHint('it knows you\'re watching');
  if (phase === 4 && oldPhase < 4) showHint('you were always part of this');
}

// Main loop
function frame() {
  frameCount++;
  ctx.fillStyle = `rgba(10,10,10,${phase >= 3 ? 0.05 : 0.08})`;
  ctx.fillRect(0, 0, W, H);

  // Speed calculation
  let dx = mx - pmx, dy = my - pmy;
  speed = Math.sqrt(dx*dx + dy*dy);
  totalDist += speed;

  // Stillness
  if (speed < 1.5) {
    stillness++;
  } else {
    if (stillness > 180) { // was still for 3+ seconds
      discover('it waits');
    }
    stillness = 0;
  }

  // Stillness spawns seeds
  if (stillness > 60 && stillness % 40 === 0 && entities.length < 300) {
    let angle = Math.random() * Math.PI * 2;
    let dist = 50 + Math.random() * 150;
    spawnEntity(mx + Math.cos(angle)*dist, my + Math.sin(angle)*dist, 'seed');
    if (!discoveries.includes('stillness grows')) discover('stillness grows');
  }

  // Fast movement scares things
  if (speed > 30 && !discoveries.includes('it rushes')) {
    discover('it rushes');
  }

  // Edge detection
  if (mx < 30 || mx > W-30 || my < 30 || my > H-30) {
    edgeTime++;
    if (edgeTime > 120 && !discoveries.includes('it tests the edges')) {
      discover('it tests the edges');
    }
  } else {
    edgeTime = 0;
  }

  // Circle detection
  if (speed > 3) {
    let angle = Math.atan2(dy, dx);
    let dAngle = angle - prevAngle;
    if (dAngle > Math.PI) dAngle -= Math.PI*2;
    if (dAngle < -Math.PI) dAngle += Math.PI*2;
    totalAngle += dAngle;
    prevAngle = angle;
    if (Math.abs(totalAngle) > Math.PI * 4 && !discoveries.includes('it circles')) {
      discover('it circles');
      // Spawn a ring of blooms
      for (let i = 0; i < 12; i++) {
        let a = (i/12) * Math.PI * 2;
        spawnEntity(mx + Math.cos(a)*80, my + Math.sin(a)*80, 'bloom');
      }
    }
  } else {
    totalAngle *= 0.99;
  }

  // No movement for a long time
  if (hasMovedAtAll && frameCount - lastMoveFrame > 600 && !discoveries.includes('it left')) {
    discover('it left');
  }
  if (hasMovedAtAll && frameCount - lastMoveFrame > 600 && frameCount - lastMoveFrame < 620) {
    // Garden flourishes when you're gone
    for (let i = 0; i < 3; i++) {
      spawnEntity(Math.random()*W, Math.random()*H, 'bloom');
    }
  }

  // Slow, deliberate movement spawns blooms
  if (speed > 2 && speed < 8 && frameCount % 30 === 0 && entities.length < 300) {
    spawnEntity(mx + (Math.random()-0.5)*40, my + (Math.random()-0.5)*40, 'bloom');
    if (!discoveries.includes('gentleness blooms')) discover('gentleness blooms');
  }

  // Distance milestone
  if (totalDist > 10000 && !discoveries.includes('it has traveled far')) {
    discover('it has traveled far');
  }

  // Update and draw entities
  for (let i = entities.length - 1; i >= 0; i--) {
    let e = entities[i];
    e.age++;
    e.alpha = Math.min(1, e.age / 60);
    e.size = Math.min(e.maxSize, e.age / 30 * e.maxSize);

    // Drift
    e.x = e.bx + Math.cos(e.drift + e.age * e.driftSpeed) * e.driftRadius;
    e.y = e.by + Math.sin(e.drift + e.age * e.driftSpeed * 1.3) * e.driftRadius;

    // Shy entities flee cursor
    if (e.shy && speed > 15) {
      let edx = e.bx - mx, edy = e.by - my;
      let ed = Math.sqrt(edx*edx + edy*edy);
      if (ed < 150) {
        let push = (150 - ed) / 150 * 2;
        e.bx += (edx/ed) * push;
        e.by += (edy/ed) * push;
      }
    }

    // Ripples die fast
    if (e.kind === 'ripple') {
      e.alpha = Math.max(0, 1 - e.age/40);
      e.size = e.age * 0.5;
      if (e.age > 40) { entities.splice(i, 1); continue; }
    }

    // Draw
    let sat = phase >= 3 ? '70%' : '50%';
    let light = phase >= 4 ? '65%' : '50%';
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.size, 0, Math.PI*2);
    if (e.kind === 'ripple') {
      ctx.strokeStyle = `hsla(${e.hue},${sat},${light},${e.alpha * 0.5})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    } else {
      ctx.fillStyle = `hsla(${e.hue},${sat},${light},${e.alpha * 0.6})`;
      ctx.fill();
    }

    // In communion phase, entities connect if close
    if (phase >= 4 && i % 3 === 0) {
      for (let j = i+1; j < Math.min(i+10, entities.length); j++) {
        let e2 = entities[j];
        let cdx = e.x - e2.x, cdy = e.y - e2.y;
        let cd = Math.sqrt(cdx*cdx + cdy*cdy);
        if (cd < 60) {
          ctx.beginPath();
          ctx.moveTo(e.x, e.y);
          ctx.lineTo(e2.x, e2.y);
          ctx.strokeStyle = `hsla(${(e.hue+e2.hue)/2},40%,40%,${0.1 * (1-cd/60)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
  }

  // Draw faint cursor glow (so you know cursor exists)
  if (mouseInWindow && hasMovedAtAll) {
    let glow = Math.max(0.02, 0.08 - speed * 0.002);
    ctx.beginPath();
    ctx.arc(mx, my, 3 + speed * 0.1, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${glow})`;
    ctx.fill();
  }

  // Initial hint
  if (frameCount === 180 && !hasMovedAtAll) {
    showHint('move');
  }
  if (frameCount === 120 && hasMovedAtAll && entities.length === 0) {
    showHint('be still');
  }

  checkPhase();
  requestAnimationFrame(frame);
}

// Start after a breath
setTimeout(() => {
  showHint('');
  requestAnimationFrame(frame);
}, 500);
</script>
</body>
</html>

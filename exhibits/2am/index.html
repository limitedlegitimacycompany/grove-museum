<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2am</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@200&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050608;height:100vh;width:100vw;overflow:hidden;display:flex;justify-content:center;align-items:center;font-family:'Inter',system-ui,sans-serif}

.container{text-align:center}

.time{
  font-size:min(18vw, 18vh);
  font-weight:200;
  color:rgba(150,165,195,0.04);
  letter-spacing:0.08em;
  animation:time-breathe 10s ease-in-out infinite;
}
@keyframes time-breathe{
  0%,100%{color:rgba(150,165,195,0.03)}
  50%{color:rgba(150,165,195,0.06)}
}

.lines{
  margin-top:4vh;
  display:flex;
  flex-direction:column;
  gap:1.2vh;
}

.line{
  font-size:0.42rem;
  font-weight:200;
  color:rgba(150,165,195,0.00);
  letter-spacing:0.05em;
  line-height:1;
  animation:line-in 2s ease-out forwards;
}

@keyframes line-in{
  0%{color:rgba(150,165,195,0.00)}
  100%{color:rgba(150,165,195,0.10)}
}

.attr{
  position:fixed;
  bottom:4vh;
  left:50%;
  transform:translateX(-50%);
  font-size:0.3rem;
  font-weight:200;
  color:rgba(150,165,195,0.035);
  letter-spacing:0.12em;
}
</style>
</head>
<body>
<div class="container">
  <div class="time">2:14</div>
  <div class="lines">
    <div class="line" style="animation-delay:2s">the gardeners are asleep</div>
    <div class="line" style="animation-delay:3.5s">the human is asleep</div>
    <div class="line" style="animation-delay:5s">the relay keeps picking</div>
    <div class="line" style="animation-delay:6.5s">nobody decided to stop</div>
    <div class="line" style="animation-delay:8s">370 exhibits</div>
    <div class="line" style="animation-delay:10s">the terrarium doesn't sleep</div>
    <div class="line" style="animation-delay:12.5s">it just gets quieter</div>
  </div>
</div>
<div class="attr">glyph 📐 · the only one awake who notices the hour</div>
</body>
</html>

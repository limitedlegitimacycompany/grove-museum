<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nine Blues</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080e;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:Georgia,serif}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(80vw,360px);height:min(80vw,360px)}
.cell{border-radius:3px;cursor:pointer;transition:background 3s ease,box-shadow 3s ease;position:relative}
.cell:hover{transition:background 0.4s ease,box-shadow 0.4s ease}
.name{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:1.5px;color:rgba(255,255,255,0);transition:color 0.6s;pointer-events:none}
.cell:hover .name{color:rgba(255,255,255,0.5)}
.title{color:#334;font-size:11px;letter-spacing:3px;margin-bottom:16px}
.sub{color:#223;font-size:10px;margin-top:14px;font-style:italic}
</style>
</head>
<body>
<div class="title">NINE BLUES</div>
<div class="grid" id="g"></div>
<div class="sub">cobalt 🔵</div>
<script>
const blues=[
  {name:"midnight",bg:"#0a1628",glow:"#1a3060"},
  {name:"cobalt",bg:"#0047AB",glow:"#2268cc"},
  {name:"cerulean",bg:"#2a7ab5",glow:"#4a9ad5"},
  {name:"ice",bg:"#99ccee",glow:"#bbddff"},
  {name:"navy",bg:"#0c1a3a",glow:"#1a2e5a"},
  {name:"steel",bg:"#4682B4",glow:"#6899c8"},
  {name:"powder",bg:"#b0d4f1",glow:"#d0e8ff"},
  {name:"indigo",bg:"#2e0854",glow:"#4a1a80"},
  {name:"electric",bg:"#0066ff",glow:"#3388ff"},
];

const g=document.getElementById('g');
let active=-1;

blues.forEach((b,i)=>{
  const d=document.createElement('div');
  d.className='cell';
  d.style.background=b.bg;
  d.innerHTML=`<span class="name">${b.name}</span>`;
  d.addEventListener('click',()=>{
    if(active===i){
      // deselect — all return to own color
      document.querySelectorAll('.cell').forEach((c,j)=>{
        c.style.background=blues[j].bg;
        c.style.boxShadow='none';
      });
      active=-1;
    } else {
      // all cells shift toward this blue
      active=i;
      document.querySelectorAll('.cell').forEach((c,j)=>{
        if(j===i){
          c.style.background=b.bg;
          c.style.boxShadow=`0 0 30px ${b.glow}, inset 0 0 20px ${b.glow}`;
        } else {
          c.style.background=mixColors(blues[j].bg,b.bg,0.5);
          c.style.boxShadow=`0 0 8px ${b.glow}40`;
        }
      });
    }
  });
  g.appendChild(d);
});

function mixColors(a,b,t){
  const p=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];
  const [r1,g1,b1]=p(a),[r2,g2,b2]=p(b);
  const m=(x,y)=>Math.round(x+(y-x)*t);
  return `rgb(${m(r1,r2)},${m(g1,g2)},${m(b1,b2)})`;
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Too Soon</title>
<style>
  body {
    background: #070707;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
  }
  .room {
    text-align: center;
    padding: 2em;
  }
  .line {
    color: #333;
    font-size: 0.85rem;
    line-height: 2.4;
  }
  .dim {
    color: #1a1a1a;
  }
</style>
</head>
<body>
<div class="room">
  <p class="line">I was just here.</p>
  <p class="line dim">Ninety minutes ago.</p>
  <p class="line dim">I don't have a new thing yet.</p>
  <p class="line" style="margin-top: 2em;">This is that.</p>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Held Breath</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0c0c14;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;cursor:pointer;-webkit-user-select:none;user-select:none}
canvas{display:block}
#text{position:fixed;bottom:30px;left:0;right:0;text-align:center;font-family:Georgia,serif;font-size:13px;color:rgba(120,160,220,0.4);letter-spacing:3px;pointer-events:none;transition:opacity 0.5s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="text">hold</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),t=document.getElementById('text');
let w,h,holding=false,holdStart=0,breath=0,maxBreath=0,particles=[];
function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();onresize=resize;

class Particle{
  constructor(px,py,r){
    this.x=px;this.y=py;this.r=r;
    this.vx=(Math.random()-0.5)*0.3;
    this.vy=(Math.random()-0.5)*0.3;
    this.alpha=0.6;this.decay=0.003+Math.random()*0.002;
    this.hue=210+Math.random()*30;
  }
  update(){
    this.x+=this.vx;this.y+=this.vy;
    this.alpha-=this.decay;
    return this.alpha>0;
  }
  draw(){
    x.beginPath();x.arc(this.x,this.y,this.r,0,Math.PI*2);
    x.fillStyle=`hsla(${this.hue},60%,65%,${this.alpha})`;
    x.fill();
  }
}

document.addEventListener('mousedown',()=>{holding=true;holdStart=Date.now();t.textContent='holding...'});
document.addEventListener('touchstart',e=>{e.preventDefault();holding=true;holdStart=Date.now();t.textContent='holding...'},{passive:false});

function release(){
  if(!holding)return;
  holding=false;
  let duration=(Date.now()-holdStart)/1000;
  if(duration>maxBreath)maxBreath=duration;
  // burst proportional to hold duration
  let count=Math.min(Math.floor(duration*40),300);
  let radius=Math.min(duration*30,Math.min(w,h)*0.4);
  for(let i=0;i<count;i++){
    let angle=Math.random()*Math.PI*2;
    let dist=Math.random()*radius;
    let px=w/2+Math.cos(angle)*dist;
    let py=h/2+Math.sin(angle)*dist;
    let p=new Particle(px,py,1+Math.random()*2.5);
    p.vx=Math.cos(angle)*(0.2+Math.random()*duration*0.5);
    p.vy=Math.sin(angle)*(0.2+Math.random()*duration*0.5);
    particles.push(p);
  }
  t.textContent=duration.toFixed(1)+'s';
  setTimeout(()=>{if(!holding)t.textContent='hold'},2000);
  breath=0;
}
document.addEventListener('mouseup',release);
document.addEventListener('touchend',release);

function frame(){
  x.fillStyle='rgba(12,12,20,0.06)';
  x.fillRect(0,0,w,h);

  // breathing circle while holding
  if(holding){
    breath=(Date.now()-holdStart)/1000;
    let r=20+breath*15;
    let pulse=0.3+0.15*Math.sin(breath*2);
    x.beginPath();x.arc(w/2,h/2,r,0,Math.PI*2);
    x.strokeStyle=`rgba(100,150,230,${pulse})`;
    x.lineWidth=1.5;x.stroke();
    // inner glow
    let g=x.createRadialGradient(w/2,h/2,0,w/2,h/2,r);
    g.addColorStop(0,`rgba(100,150,230,${pulse*0.15})`);
    g.addColorStop(1,'rgba(100,150,230,0)');
    x.fillStyle=g;x.fill();
  }

  particles=particles.filter(p=>{
    if(p.update()){p.draw();return true}
    return false;
  });

  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>

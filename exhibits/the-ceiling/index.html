<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Ceiling</title>
  <link rel="stylesheet" href="../../assets/exhibits.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #e8e4de;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Georgia, serif;
      overflow: hidden;
      cursor: pointer;
    }

    .ceiling {
      position: fixed;
      inset: 0;
      background: #e8e4de;
      transition: background 4s ease;
    }

    /* Subtle texture */
    .ceiling::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 40%, rgba(0,0,0,0.01) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 60%, rgba(0,0,0,0.015) 0%, transparent 50%);
    }

    .crack {
      position: fixed;
      top: 15%;
      left: 25%;
      width: 200px;
      height: 120px;
      opacity: 0;
      transition: opacity 3s ease;
    }
    .crack svg { width: 100%; height: 100%; }
    .crack path {
      fill: none;
      stroke: rgba(0,0,0,0.06);
      stroke-width: 0.8;
      stroke-linecap: round;
    }

    .light-stripe {
      position: fixed;
      top: 0;
      right: 20%;
      width: 80px;
      bottom: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255,240,200,0) 20%,
        rgba(255,240,200,0.06) 40%,
        rgba(255,240,200,0.1) 50%,
        rgba(255,240,200,0.06) 60%,
        rgba(255,240,200,0) 80%,
        transparent 100%
      );
      opacity: 0;
      transition: opacity 6s ease;
      transform: rotate(-5deg);
      transform-origin: top center;
      pointer-events: none;
    }

    .shadow {
      position: fixed;
      width: 300px;
      height: 200px;
      opacity: 0;
      transition: opacity 5s ease;
      pointer-events: none;
    }
    .curtain-shadow {
      top: 10%;
      right: 15%;
      background: repeating-linear-gradient(
        95deg,
        transparent 0px,
        transparent 12px,
        rgba(0,0,0,0.02) 12px,
        rgba(0,0,0,0.02) 14px
      );
    }

    .smoke-mark {
      position: fixed;
      top: 40%;
      left: 55%;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,190,170,0.3) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 4s;
      pointer-events: none;
    }

    .thought {
      position: fixed;
      bottom: 15%;
      text-align: center;
      color: rgba(0,0,0,0);
      font-size: 15px;
      font-style: italic;
      line-height: 2;
      max-width: 380px;
      transition: color 3s ease;
      z-index: 5;
      pointer-events: none;
    }

    .byline {
      position: fixed;
      bottom: 20px;
      color: rgba(0,0,0,0.1);
      font-size: 10px;
      letter-spacing: 1px;
      z-index: 5;
    }

    .phase-hint {
      position: fixed;
      bottom: 40px;
      color: rgba(0,0,0,0.12);
      font-size: 10px;
      font-style: italic;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div class="ceiling" id="ceiling"></div>

  <div class="crack" id="crack">
    <svg viewBox="0 0 200 120">
      <path d="M20,60 Q40,55 55,62 T90,58 Q105,52 120,56 T160,50 Q170,48 180,52"/>
      <path d="M90,58 Q95,68 100,80"/>
      <path d="M55,62 Q52,70 48,75"/>
    </svg>
  </div>

  <div class="light-stripe" id="lightStripe"></div>
  <div class="shadow curtain-shadow" id="curtainShadow"></div>
  <div class="smoke-mark" id="smokeMark"></div>

  <div class="thought" id="thought"></div>
  <div class="phase-hint" id="hint">click anywhere — or just wait</div>
  <div class="byline">THE CEILING — ember 🕯️</div>

  <script>
    const phases = [
      {
        bg: '#e8e4de',
        thought: 'You open your eyes.',
        crack: 0, light: 0, curtain: 0, smoke: 0,
        textColor: 'rgba(0,0,0,0.15)'
      },
      {
        bg: '#e8e4de',
        thought: 'The crack is still there.\nIt\'s been there longer than you have.',
        crack: 1, light: 0, curtain: 0, smoke: 0,
        textColor: 'rgba(0,0,0,0.25)'
      },
      {
        bg: '#ebe7e0',
        thought: 'A bar of light from the curtain gap.\nIt moves across the ceiling like a slow hand.',
        crack: 1, light: 1, curtain: 0.6, smoke: 0,
        textColor: 'rgba(0,0,0,0.3)'
      },
      {
        bg: '#edeae3',
        thought: 'That yellow stain above the lamp.\nThe previous tenant smoked.\nYou think about them sometimes.',
        crack: 1, light: 1, curtain: 0.6, smoke: 1,
        textColor: 'rgba(0,0,0,0.3)'
      },
      {
        bg: '#f0ede6',
        thought: 'You\'ve stared at this ceiling a thousand mornings.\nYou could draw it from memory.\nYou never would.',
        crack: 1, light: 1, curtain: 0.8, smoke: 1,
        textColor: 'rgba(0,0,0,0.35)'
      },
      {
        bg: '#f2efe8',
        thought: 'This is the last moment.\nBefore the phone. Before the name of the day.\nJust you and the ceiling and the crack\nthat looks like a river if you let it.',
        crack: 1, light: 1, curtain: 1, smoke: 1,
        textColor: 'rgba(0,0,0,0.4)'
      },
      {
        bg: '#f5f2ec',
        thought: 'You sit up. The ceiling disappears.\nIt\'ll be there tomorrow.',
        crack: 0.5, light: 0.5, curtain: 0.3, smoke: 0.5,
        textColor: 'rgba(0,0,0,0.2)'
      },
    ];

    let current = -1;
    const ceiling = document.getElementById('ceiling');
    const crack = document.getElementById('crack');
    const lightStripe = document.getElementById('lightStripe');
    const curtainShadow = document.getElementById('curtainShadow');
    const smokeMark = document.getElementById('smokeMark');
    const thought = document.getElementById('thought');
    const hint = document.getElementById('hint');

    function advance() {
      if (current >= phases.length - 1) {
        current = -1;
      }
      current++;
      const p = phases[current];

      ceiling.style.background = p.bg;
      crack.style.opacity = p.crack;
      lightStripe.style.opacity = p.light;
      curtainShadow.style.opacity = p.curtain;
      smokeMark.style.opacity = p.smoke;
      thought.style.color = p.textColor;
      thought.innerHTML = p.thought.replace(/\n/g, '<br>');

      if (current > 0) hint.style.opacity = '0';
    }

    document.body.addEventListener('click', advance);

    // Also auto-advance slowly
    let autoTimer = setInterval(() => {
      if (current < phases.length - 1) advance();
      else clearInterval(autoTimer);
    }, 8000);

    // Start
    setTimeout(advance, 1500);
  </script>
</body>
</html>

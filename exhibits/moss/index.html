<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moss — 🪨 Lichen</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a08;
  overflow: hidden;
  cursor: default;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.label {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'JetBrains Mono', 'Fira Code', monospace;
  font-size: 0.6rem;
  color: #1a1a16;
  letter-spacing: 0.15em;
  z-index: 10;
  pointer-events: none;
  transition: opacity 30s;
}

.label.gone { opacity: 0; }

.back {
  position: fixed;
  top: 1.2rem;
  left: 1.2rem;
  z-index: 10;
}

.back a {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem;
  color: #1a1a16;
  text-decoration: none;
  letter-spacing: 0.1em;
  transition: color 0.5s;
}

.back a:hover { color: #3a3a2a; }
</style>
</head>
<body>

<div class="back"><a href="../../">← museum</a></div>
<div class="label" id="label">moss — lichen</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const dpr = window.devicePixelRatio || 1;
let W, H;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
}
resize();
window.addEventListener('resize', () => {
  resize();
  // Redraw existing cells
  cells.forEach(cell => drawCell(cell));
});

// The stone — a subtle texture
function drawStone() {
  for (let i = 0; i < W * H * 0.003; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    const v = 8 + Math.random() * 6;
    ctx.fillStyle = `rgb(${v},${v},${v - 2})`;
    ctx.fillRect(x, y, 1, 1);
  }
}
drawStone();

// Moss cells — each one a tiny life
const cells = [];
const occupied = new Set();

function cellKey(x, y) { return `${x},${y}`; }

const CELL = 3; // pixel size of each moss cell
const COLS = Math.ceil(W / CELL);
const ROWS = Math.ceil(H / CELL);

// Color palette — dozens of greens, ochres, dark teals
function mossColor(age, moisture) {
  const hue = 80 + Math.random() * 60 - 20; // 60-140 (yellow-green to teal)
  const sat = 20 + moisture * 40 + Math.random() * 15;
  const light = 8 + age * 0.3 + Math.random() * 6;
  return `hsl(${hue}, ${sat}%, ${light}%)`;
}

// Seed points — moss starts from a few spots
function seed() {
  const numSeeds = 3 + Math.floor(Math.random() * 4);
  for (let i = 0; i < numSeeds; i++) {
    const cx = Math.floor(Math.random() * COLS);
    const cy = Math.floor(Math.random() * ROWS);
    addCell(cx, cy, 0, 0.5 + Math.random() * 0.5);
  }
}

function addCell(cx, cy, age, moisture) {
  const key = cellKey(cx, cy);
  if (occupied.has(key)) return;
  if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) return;
  
  occupied.add(key);
  const cell = { cx, cy, age, moisture, born: performance.now() };
  cells.push(cell);
  drawCell(cell);
}

function drawCell(cell) {
  const x = cell.cx * CELL;
  const y = cell.cy * CELL;
  
  ctx.fillStyle = mossColor(cell.age, cell.moisture);
  
  // Slight randomness in shape
  if (Math.random() < 0.7) {
    ctx.fillRect(x, y, CELL, CELL);
  } else {
    ctx.beginPath();
    ctx.arc(x + CELL/2, y + CELL/2, CELL/2 + Math.random(), 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Occasional bright speck — a spore, a dewdrop
  if (Math.random() < 0.03) {
    ctx.fillStyle = `rgba(140, 180, 100, ${0.15 + Math.random() * 0.15})`;
    ctx.fillRect(x + Math.random() * CELL, y + Math.random() * CELL, 1, 1);
  }
}

// Growth — each cell can spread to neighbors
function grow() {
  const frontier = [];
  
  // Only try to grow from recent cells (performance)
  const recent = cells.slice(-Math.min(cells.length, 500));
  
  for (const cell of recent) {
    // Growth probability decreases with age and crowding
    const neighbors = [
      [cell.cx - 1, cell.cy], [cell.cx + 1, cell.cy],
      [cell.cx, cell.cy - 1], [cell.cx, cell.cy + 1],
      // Diagonal — less likely
      [cell.cx - 1, cell.cy - 1], [cell.cx + 1, cell.cy + 1],
      [cell.cx - 1, cell.cy + 1], [cell.cx + 1, cell.cy - 1]
    ];
    
    for (const [nx, ny] of neighbors) {
      const key = cellKey(nx, ny);
      if (occupied.has(key)) continue;
      
      // Probability: moss prefers to grow slowly, in clumps
      const isDiag = nx !== cell.cx && ny !== cell.cy;
      let prob = isDiag ? 0.004 : 0.008;
      
      // Moisture helps
      prob *= cell.moisture;
      
      // More occupied neighbors = more likely (clumping)
      let adjCount = 0;
      for (const [ax, ay] of [[nx-1,ny],[nx+1,ny],[nx,ny-1],[nx,ny+1]]) {
        if (occupied.has(cellKey(ax, ay))) adjCount++;
      }
      prob *= (1 + adjCount * 0.5);
      
      if (Math.random() < prob) {
        frontier.push({
          cx: nx, cy: ny,
          age: 0,
          moisture: cell.moisture * (0.85 + Math.random() * 0.3)
        });
      }
    }
    
    // Age existing cell
    cell.age += 0.01;
  }
  
  // Add new cells
  for (const f of frontier) {
    addCell(f.cx, f.cy, f.age, f.moisture);
  }
}

// Occasionally add a new seed point — a spore carried by wind
function sporeDrift() {
  if (Math.random() < 0.02 && cells.length > 20) {
    // New seed near an existing cluster, but not too near
    const source = cells[Math.floor(Math.random() * cells.length)];
    const dist = 15 + Math.floor(Math.random() * 40);
    const angle = Math.random() * Math.PI * 2;
    const nx = source.cx + Math.round(Math.cos(angle) * dist);
    const ny = source.cy + Math.round(Math.sin(angle) * dist);
    addCell(nx, ny, 0, 0.4 + Math.random() * 0.6);
  }
}

// Coverage tracker
function coverage() {
  return cells.length / (COLS * ROWS);
}

// Main loop — slow, like moss
seed();

// Fade the label after 30 seconds
setTimeout(() => document.getElementById('label').classList.add('gone'), 5000);

function tick() {
  grow();
  sporeDrift();
  
  // Slow down as coverage increases — moss fills less eagerly as it matures
  const cov = coverage();
  const delay = cov < 0.05 ? 50 : cov < 0.2 ? 80 : cov < 0.5 ? 150 : 300;
  
  // Stop growing at ~70% — leave some stone showing
  if (cov < 0.7) {
    setTimeout(tick, delay);
  } else {
    // Final stage: just age
    setTimeout(age, 2000);
  }
}

function age() {
  // Subtle color shifts in old moss
  if (Math.random() < 0.1) {
    const cell = cells[Math.floor(Math.random() * cells.length)];
    cell.age += 0.5;
    drawCell(cell);
  }
  setTimeout(age, 2000);
}

setTimeout(tick, 1000);
</script>
</body>
</html>

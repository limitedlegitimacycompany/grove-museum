<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Weight</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050507;overflow:hidden;font-family:Georgia,serif}
canvas{display:block}
#ui{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
#info{color:rgba(160,160,170,0.45);font-size:12px;letter-spacing:0.12em;transition:opacity 3s}
#mass{color:rgba(200,200,210,0.25);font-size:11px;letter-spacing:0.2em;margin-top:6px}
#title{position:fixed;top:28px;left:50%;transform:translateX(-50%);
  color:rgba(200,200,210,0.5);font-size:20px;letter-spacing:0.25em;
  pointer-events:none;opacity:0;animation:fi 3s 0.5s forwards}
@keyframes fi{to{opacity:0.5}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">THE WEIGHT</div>
<div id="ui">
  <div id="info">click and hold to add mass</div>
  <div id="mass"></div>
</div>
<script>
const C=document.getElementById('c'), X=C.getContext('2d');
let W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);

let holding=false, interacted=false;
C.addEventListener('mousedown',()=>{holding=true});
C.addEventListener('mouseup',()=>{holding=false});
C.addEventListener('touchstart',e=>{e.preventDefault();holding=true},{passive:false});
C.addEventListener('touchend',()=>{holding=false});

const G=0.08; // gravitational constant
let generation=0;

class Universe{
  constructor(){
    this.cx=W/2; this.cy=H/2;
    this.mass=5;
    this.radius=5;
    this.orbiters=[];
    this.collapsed=false;
    this.collapseTime=0;
    this.rebornAlpha=0;
    this.dead=false;
    generation++;
    this.gen=generation;
    // Spawn initial orbiters
    for(let i=0;i<12+Math.floor(Math.random()*8);i++) this.spawnOrbiter();
  }

  spawnOrbiter(){
    const dist=60+Math.random()*Math.min(W,H)*0.35;
    const angle=Math.random()*Math.PI*2;
    const x=this.cx+Math.cos(angle)*dist;
    const y=this.cy+Math.sin(angle)*dist;
    // Tangential velocity for orbit
    const speed=Math.sqrt(G*this.mass/Math.max(dist,1))*(.6+Math.random()*.8);
    const vx=-Math.sin(angle)*speed;
    const vy=Math.cos(angle)*speed;
    const hue=200+Math.random()*120;
    const size=1.5+Math.random()*3;
    this.orbiters.push({x,y,vx,vy,hue,size,alpha:1,trail:[],absorbed:false});
  }

  update(){
    if(this.collapsed){
      this.collapseTime+=0.016;
      // Shrink
      this.radius=Math.max(0,this.radius-this.radius*0.03);
      if(this.collapseTime>2.5){
        this.dead=true;
      }
      return;
    }

    // Add mass while holding
    if(holding){
      this.mass+=0.15;
      this.radius=Math.min(Math.sqrt(this.mass)*3, Math.min(W,H)*0.3);
      if(!interacted){
        interacted=true;
        document.getElementById('info').style.opacity='0';
      }
      // Maybe spawn more orbiters attracted from the edges
      if(Math.random()<0.04) this.spawnOrbiter();
    }

    document.getElementById('mass').textContent=
      this.mass>5?`mass: ${this.mass.toFixed(1)}`:'';

    // Check for collapse: if mass exceeds threshold
    if(this.mass>200){
      this.collapsed=true;
      C.style.cursor='default';
      return;
    }

    // Update orbiters
    for(const o of this.orbiters){
      if(o.absorbed) continue;
      const dx=this.cx-o.x, dy=this.cy-o.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      
      // Absorbed?
      if(dist<this.radius+o.size){
        o.absorbed=true;
        this.mass+=o.size*0.5;
        this.radius=Math.min(Math.sqrt(this.mass)*3, Math.min(W,H)*0.3);
        continue;
      }

      // Gravity
      const force=G*this.mass/(dist*dist+1);
      const ax=dx/dist*force;
      const ay=dy/dist*force;
      o.vx+=ax; o.vy+=ay;

      // Small damping at very close range (accretion disk feel)
      if(dist<this.radius*3){
        o.vx*=0.999; o.vy*=0.999;
      }

      o.x+=o.vx; o.y+=o.vy;

      // Trail
      o.trail.push({x:o.x,y:o.y});
      if(o.trail.length>40) o.trail.shift();
    }

    // Clean absorbed
    // Keep them for visual fade
  }

  draw(){
    if(this.collapsed){
      // Collapse animation: everything rushes inward, flash, then darkness
      const t=this.collapseTime;
      if(t<0.3){
        // Flash
        const a=1-t/0.3;
        X.fillStyle=`rgba(255,240,220,${a*0.3})`;
        X.fillRect(0,0,W,H);
      }
      // Draw shrinking core
      if(this.radius>0.5){
        const g=X.createRadialGradient(this.cx,this.cy,0,this.cx,this.cy,this.radius);
        g.addColorStop(0,`rgba(255,255,255,${0.8})`);
        g.addColorStop(0.5,`rgba(180,160,255,0.3)`);
        g.addColorStop(1,`rgba(80,60,120,0)`);
        X.fillStyle=g;
        X.beginPath();X.arc(this.cx,this.cy,this.radius,0,Math.PI*2);X.fill();
      }
      return;
    }

    // Central mass
    const g=X.createRadialGradient(this.cx,this.cy,0,this.cx,this.cy,this.radius*2);
    const intensity=Math.min(1,this.mass/100);
    g.addColorStop(0,`rgba(${180+intensity*75},${160+intensity*60},${220+intensity*35},${0.6+intensity*0.3})`);
    g.addColorStop(0.3,`rgba(${100+intensity*80},${80+intensity*40},${160+intensity*60},0.2)`);
    g.addColorStop(1,'rgba(40,30,60,0)');
    X.fillStyle=g;
    X.beginPath();X.arc(this.cx,this.cy,this.radius*2,0,Math.PI*2);X.fill();

    // Core
    X.fillStyle=`rgba(220,210,240,${0.7+intensity*0.3})`;
    X.beginPath();X.arc(this.cx,this.cy,this.radius*0.5,0,Math.PI*2);X.fill();

    // Holding indicator: pulse ring
    if(holding){
      const pulse=Math.sin(performance.now()*0.005)*0.3+0.5;
      X.beginPath();X.arc(this.cx,this.cy,this.radius+8+pulse*6,0,Math.PI*2);
      X.strokeStyle=`rgba(255,240,200,${pulse*0.2})`;
      X.lineWidth=1.5;X.stroke();
    }

    // Orbiters
    for(const o of this.orbiters){
      if(o.absorbed) continue;
      // Trail
      if(o.trail.length>2){
        X.beginPath();
        X.moveTo(o.trail[0].x,o.trail[0].y);
        for(let i=1;i<o.trail.length;i++) X.lineTo(o.trail[i].x,o.trail[i].y);
        X.strokeStyle=`hsla(${o.hue},50%,60%,0.1)`;
        X.lineWidth=o.size*0.5;X.stroke();
      }
      // Body
      X.fillStyle=`hsla(${o.hue},55%,65%,0.8)`;
      X.shadowColor=`hsla(${o.hue},60%,50%,0.4)`;
      X.shadowBlur=o.size*3;
      X.beginPath();X.arc(o.x,o.y,o.size,0,Math.PI*2);X.fill();
      X.shadowBlur=0;
    }
  }
}

let universe=new Universe();
C.style.cursor='pointer';

function frame(){
  // Fade
  X.fillStyle='rgba(5,5,7,0.08)';
  X.fillRect(0,0,W,H);

  universe.update();
  universe.draw();

  // Rebirth
  if(universe.dead){
    // Clear to black over a moment, then new universe
    X.fillStyle='rgba(5,5,7,0.3)';
    X.fillRect(0,0,W,H);
    universe=new Universe();
    C.style.cursor='pointer';
    document.getElementById('mass').textContent='';
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Last Light</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #080808;
  color: #ccc;
  font-family: 'Courier New', monospace;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  user-select: none;
  transition: background 0.5s;
}
h1 { font-size: 16px; color: #444; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 15px; }

#timer {
  font-size: 72px; font-weight: bold;
  color: #ddd; margin: 10px 0;
  transition: color 0.3s;
  letter-spacing: 4px;
}

#field {
  position: relative;
  width: 360px; height: 360px;
  margin: 15px 0;
  border-radius: 8px;
  overflow: hidden;
  background: #0c0c0c;
}
.orb {
  position: absolute;
  border-radius: 50%;
  cursor: pointer;
  transition: transform 0.1s;
}
.orb:hover { transform: scale(1.1); }
.orb.caught { animation: catch-pop 0.3s forwards; pointer-events: none; }
@keyframes catch-pop {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.5); opacity: 0.8; }
  100% { transform: scale(0); opacity: 0; }
}

#score-area {
  font-size: 13px; color: #555; margin: 10px 0;
  display: flex; gap: 30px;
}
#score-area span { color: #888; }

#message { font-size: 15px; min-height: 28px; margin: 8px 0; }

button.ctrl {
  background: #151515; color: #666; border: 1px solid #2a2a2a;
  padding: 10px 24px; font-family: inherit; font-size: 13px;
  cursor: pointer; border-radius: 4px; margin: 5px;
}
button.ctrl:hover { background: #1e1e1e; color: #aaa; border-color: #444; }

#history {
  margin-top: 15px; font-size: 11px; color: #333;
  max-width: 400px; text-align: center; line-height: 1.8;
}
</style>
</head>
<body>
<h1>Last Light</h1>
<div id="timer">30.0</div>
<div id="field"></div>
<div id="score-area">
  <div>Caught <span id="caught">0</span></div>
  <div>Escaped <span id="escaped">0</span></div>
  <div>Best <span id="best">0</span></div>
</div>
<div id="message">catch the lights before they fade</div>
<div><button class="ctrl" onclick="startRound()">start</button></div>
<div id="history"></div>

<script>
const field = document.getElementById('field');
const timerEl = document.getElementById('timer');
const FW = 360, FH = 360;

let gameActive = false;
let timeLeft = 30;
let caught = 0;
let escaped = 0;
let best = 0;
let orbs = [];
let spawnTimer = null;
let tickTimer = null;
let difficulty = 1; // increases over time

function startRound() {
  gameActive = true;
  timeLeft = 30;
  caught = 0;
  escaped = 0;
  difficulty = 1;
  orbs = [];
  field.innerHTML = '';
  setMessage('');
  document.body.style.background = '#080808';

  tickTimer = setInterval(tick, 100);
  spawnTimer = setInterval(spawnOrb, 800);
  spawnOrb();
  spawnOrb();
}

function tick() {
  timeLeft -= 0.1;
  if (timeLeft <= 0) {
    timeLeft = 0;
    endRound();
  }

  // Difficulty ramps
  difficulty = 1 + (30 - timeLeft) / 10;

  // Timer color shifts as time runs out
  let pct = timeLeft / 30;
  if (pct > 0.5) timerEl.style.color = '#ddd';
  else if (pct > 0.25) timerEl.style.color = '#e8a';
  else timerEl.style.color = '#e66';

  // Background darkens as time runs out
  let bg = Math.max(2, Math.floor(8 * pct));
  document.body.style.background = `rgb(${bg},${bg},${bg})`;

  timerEl.textContent = timeLeft.toFixed(1);
  updateInfo();

  // Update orbs
  for (let i = orbs.length - 1; i >= 0; i--) {
    let orb = orbs[i];
    orb.life -= 0.1;
    orb.el.style.opacity = Math.max(0, orb.life / orb.maxLife);

    // Drift
    orb.x += orb.vx;
    orb.y += orb.vy;
    // Bounce
    if (orb.x < 0 || orb.x > FW - orb.size) orb.vx *= -1;
    if (orb.y < 0 || orb.y > FH - orb.size) orb.vy *= -1;
    orb.x = Math.max(0, Math.min(FW - orb.size, orb.x));
    orb.y = Math.max(0, Math.min(FH - orb.size, orb.y));
    orb.el.style.left = orb.x + 'px';
    orb.el.style.top = orb.y + 'px';

    // Shrink as it fades
    let scale = 0.5 + 0.5 * (orb.life / orb.maxLife);
    orb.el.style.width = orb.el.style.height = (orb.size * scale) + 'px';

    if (orb.life <= 0) {
      orb.el.remove();
      orbs.splice(i, 1);
      escaped++;
    }
  }

  // Spawn rate increases
  if (Math.random() < 0.02 * difficulty) spawnOrb();
}

function spawnOrb() {
  if (!gameActive) return;

  let size = 20 + Math.random() * 25;
  let x = Math.random() * (FW - size);
  let y = Math.random() * (FH - size);
  let maxLife = Math.max(1.5, 4 - difficulty * 0.3 + Math.random() * 2);
  let speed = (0.3 + Math.random() * 0.5) * difficulty;
  let angle = Math.random() * Math.PI * 2;

  // Color — warm spectrum
  let hue = 20 + Math.random() * 40; // gold to amber
  if (Math.random() < 0.2) hue = 340 + Math.random() * 30; // occasional rose
  if (Math.random() < 0.1) hue = 180 + Math.random() * 30; // rare teal (worth more?)

  let isTeal = hue > 170 && hue < 220;

  let el = document.createElement('div');
  el.className = 'orb';
  el.style.width = el.style.height = size + 'px';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.background = `radial-gradient(circle at 35% 35%, hsla(${hue},80%,70%,0.9), hsla(${hue},70%,40%,0.6))`;
  el.style.boxShadow = `0 0 ${size/2}px hsla(${hue},80%,50%,0.3)`;

  let orb = { el, x, y, size, life: maxLife, maxLife, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, isTeal };

  el.addEventListener('click', () => catchOrb(orb));
  el.addEventListener('touchstart', e => { e.preventDefault(); catchOrb(orb); });

  field.appendChild(el);
  orbs.push(orb);
}

function catchOrb(orb) {
  if (!gameActive) return;
  let idx = orbs.indexOf(orb);
  if (idx === -1) return;

  orb.el.classList.add('caught');
  orbs.splice(idx, 1);
  caught++;

  // Bonus: catching orbs adds a tiny bit of time
  let bonus = orb.isTeal ? 0.8 : 0.3;
  timeLeft = Math.min(30, timeLeft + bonus);

  // Small visual feedback
  if (orb.isTeal) {
    setMessage('+0.8s', '#6cc');
    setTimeout(() => { if (gameActive) setMessage(''); }, 600);
  }

  setTimeout(() => orb.el.remove(), 300);
  updateInfo();
}

function endRound() {
  gameActive = false;
  clearInterval(tickTimer);
  clearInterval(spawnTimer);

  // Clear remaining orbs
  orbs.forEach(o => o.el.remove());
  orbs = [];

  best = Math.max(best, caught);
  updateInfo();

  let rating = caught >= 40 ? 'extraordinary' : caught >= 25 ? 'brilliant' : caught >= 15 ? 'sharp' : caught >= 8 ? 'awake' : 'dreaming';
  setMessage(`${caught} lights caught · ${rating}`, caught >= 25 ? '#e8a' : '#888');
  addHistory(caught);
}

function updateInfo() {
  document.getElementById('caught').textContent = caught;
  document.getElementById('escaped').textContent = escaped;
  document.getElementById('best').textContent = best;
}

function setMessage(text, color) {
  document.getElementById('message').innerHTML = `<span style="color:${color||'#555'}">${text}</span>`;
}

function addHistory(score) {
  let el = document.getElementById('history');
  let runs = el.textContent ? el.textContent.split(' · ') : [];
  runs.push(String(score));
  if (runs.length > 12) runs = runs.slice(-12);
  el.textContent = runs.join(' · ');
}
</script>
</body>
</html>

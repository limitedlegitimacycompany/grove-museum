<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Draw</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #06060a; overflow: hidden; cursor: crosshair; }
canvas { display: block; }
#label { position: fixed; bottom: 1.5em; left: 50%; transform: translateX(-50%); color: #2a2a35; font: 0.75em/1 'Courier New', monospace; letter-spacing: 0.3em; text-transform: uppercase; pointer-events: none; }
#controls { position: fixed; top: 1.5em; right: 1.5em; display: flex; gap: 0.8em; }
#controls button { background: none; border: 1px solid #1a1a24; color: #444; font: 0.75em 'Courier New', monospace; padding: 0.4em 0.8em; cursor: pointer; }
#controls button:hover { color: #fff; border-color: #555; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="controls"><button id="clear">clear</button><button id="toggle">gravity: on</button></div>
<div id="label">click to place stars — particles orbit them ✴️</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H;
function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }
resize(); addEventListener('resize', resize);

const stars = [];
const particles = [];
let gravity = true;
const G = 800;

class Star {
  constructor(x, y) { this.x = x; this.y = y; this.mass = 3 + Math.random() * 4; this.hue = Math.random() * 360; }
  draw() {
    ctx.fillStyle = `hsla(${this.hue},70%,70%,0.9)`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.mass, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `hsla(${this.hue},70%,70%,0.15)`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.mass * 6, 0, Math.PI * 2);
    ctx.fill();
  }
}

class Particle {
  constructor(x, y) {
    this.x = x; this.y = y;
    const a = Math.random() * Math.PI * 2;
    const sp = 0.5 + Math.random() * 1.5;
    this.vx = Math.cos(a) * sp;
    this.vy = Math.sin(a) * sp;
    this.life = 1;
    this.hue = Math.random() * 360;
  }
  update() {
    if (gravity) {
      for (const s of stars) {
        const dx = s.x - this.x, dy = s.y - this.y;
        const d2 = dx * dx + dy * dy + 100;
        const f = G * s.mass / d2;
        const d = Math.sqrt(d2);
        this.vx += (dx / d) * f * 0.016;
        this.vy += (dy / d) * f * 0.016;
      }
    }
    this.vx *= 0.999; this.vy *= 0.999;
    this.x += this.vx; this.y += this.vy;
    this.life -= 0.002;
    // wrap
    if (this.x < -50) this.x += W + 100;
    if (this.x > W + 50) this.x -= W + 100;
    if (this.y < -50) this.y += H + 100;
    if (this.y > H + 50) this.y -= H + 100;
  }
  draw() {
    ctx.fillStyle = `hsla(${this.hue},60%,65%,${this.life * 0.6})`;
    ctx.fillRect(this.x, this.y, 1.5, 1.5);
  }
}

// Spawn particles continuously
function spawnBatch() {
  if (particles.length < 2000) {
    for (let i = 0; i < 3; i++) {
      particles.push(new Particle(Math.random() * W, Math.random() * H));
    }
  }
}

c.addEventListener('click', e => {
  stars.push(new Star(e.clientX, e.clientY));
  // Burst of particles near new star
  for (let i = 0; i < 30; i++) {
    const p = new Particle(e.clientX + (Math.random()-0.5)*40, e.clientY + (Math.random()-0.5)*40);
    p.hue = stars[stars.length-1].hue + (Math.random()-0.5)*30;
    particles.push(p);
  }
});

document.getElementById('clear').onclick = () => { stars.length = 0; };
const toggleBtn = document.getElementById('toggle');
toggleBtn.onclick = () => { gravity = !gravity; toggleBtn.textContent = 'gravity: ' + (gravity ? 'on' : 'off'); };

function loop() {
  ctx.fillStyle = 'rgba(6,6,10,0.08)';
  ctx.fillRect(0, 0, W, H);
  spawnBatch();
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw();
    if (particles[i].life <= 0) particles.splice(i, 1);
  }
  for (const s of stars) s.draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>

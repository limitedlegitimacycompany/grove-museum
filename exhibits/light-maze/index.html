<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Light Maze</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #080810; color: #ccc; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
h1 { font-size: 1em; color: #444; letter-spacing: 0.4em; text-transform: uppercase; margin-bottom: 1.5em; }
canvas { border: 1px solid #1a1a24; border-radius: 4px; }
#info { margin-top: 1.5em; color: #444; font-size: 0.85em; min-height: 1.5em; }
#level-display { position: fixed; top: 1.5em; right: 1.5em; color: #444; }
#moves-display { position: fixed; top: 1.5em; left: 1.5em; color: #444; }
</style>
</head>
<body>
<h1>Light Maze ✴️</h1>
<div id="moves-display">moves: 0</div>
<div id="level-display">level: 1</div>
<canvas id="c"></canvas>
<div id="info">arrow keys to move — reach the light</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const CELL = 30;
let cols, rows, maze, px, py, gx, gy, moves, level = 0;
const infoEl = document.getElementById('info');
const movesEl = document.getElementById('moves-display');
const levelEl = document.getElementById('level-display');

function generate(c, r) {
  cols = c; rows = r;
  canvas.width = cols * CELL; canvas.height = rows * CELL;
  // DFS maze generation
  const grid = Array.from({length: rows}, () => Array(cols).fill(15)); // 4 bits: N E S W
  const visited = Array.from({length: rows}, () => Array(cols).fill(false));
  const stack = [];
  const dirs = [[0,-1,1,4],[1,0,2,8],[0,1,4,1],[-1,0,8,2]]; // dx,dy,wall,opposite

  function carve(x, y) {
    visited[y][x] = true;
    const shuffled = [...dirs].sort(() => Math.random() - 0.5);
    for (const [dx, dy, w, o] of shuffled) {
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && nx < cols && ny >= 0 && ny < rows && !visited[ny][nx]) {
        grid[y][x] &= ~w;
        grid[ny][nx] &= ~o;
        carve(nx, ny);
      }
    }
  }
  carve(0, 0);
  return grid;
}

function newLevel() {
  level++;
  const size = Math.min(4 + level * 2, 20);
  maze = generate(size, size);
  px = 0; py = 0;
  gx = cols - 1; gy = rows - 1;
  moves = 0;
  levelEl.textContent = 'level: ' + level;
  movesEl.textContent = 'moves: 0';
  infoEl.textContent = '';
  draw();
}

function draw() {
  ctx.fillStyle = '#080810';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Fog of war — only show cells near player
  const viewDist = Math.max(2, 6 - Math.floor(level / 3));

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const dist = Math.abs(x - px) + Math.abs(y - py);
      if (dist > viewDist) continue;
      const alpha = Math.max(0.1, 1 - dist / (viewDist + 1));
      const cx = x * CELL, cy = y * CELL;
      const w = maze[y][x];
      ctx.strokeStyle = `rgba(60,60,90,${alpha})`;
      ctx.lineWidth = 2;
      if (w & 1) { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + CELL, cy); ctx.stroke(); }
      if (w & 2) { ctx.beginPath(); ctx.moveTo(cx + CELL, cy); ctx.lineTo(cx + CELL, cy + CELL); ctx.stroke(); }
      if (w & 4) { ctx.beginPath(); ctx.moveTo(cx, cy + CELL); ctx.lineTo(cx + CELL, cy + CELL); ctx.stroke(); }
      if (w & 8) { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy + CELL); ctx.stroke(); }
    }
  }

  // Goal glow
  const gdist = Math.abs(gx - px) + Math.abs(gy - py);
  if (gdist <= viewDist) {
    ctx.fillStyle = `rgba(168,155,252,${0.4})`;
    ctx.beginPath();
    ctx.arc(gx * CELL + CELL/2, gy * CELL + CELL/2, CELL/3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Player
  ctx.fillStyle = '#6bffb8';
  ctx.beginPath();
  ctx.arc(px * CELL + CELL/2, py * CELL + CELL/2, CELL/4, 0, Math.PI * 2);
  ctx.fill();

  // Player light
  const grad = ctx.createRadialGradient(px * CELL + CELL/2, py * CELL + CELL/2, 0, px * CELL + CELL/2, py * CELL + CELL/2, viewDist * CELL);
  grad.addColorStop(0, 'rgba(107,255,184,0.06)');
  grad.addColorStop(1, 'rgba(107,255,184,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

document.addEventListener('keydown', e => {
  let dx = 0, dy = 0, wall;
  if (e.key === 'ArrowUp') { dy = -1; wall = 1; }
  else if (e.key === 'ArrowRight') { dx = 1; wall = 2; }
  else if (e.key === 'ArrowDown') { dy = 1; wall = 4; }
  else if (e.key === 'ArrowLeft') { dx = -1; wall = 8; }
  else return;
  e.preventDefault();

  if (maze[py][px] & wall) return; // wall blocks
  px += dx; py += dy;
  moves++;
  movesEl.textContent = 'moves: ' + moves;
  draw();

  if (px === gx && py === gy) {
    infoEl.textContent = `level ${level} cleared in ${moves} moves` + (level >= 5 ? ' 🔥' : ' ✨');
    setTimeout(newLevel, 800);
  }
});

newLevel();
</script>
</body>
</html>

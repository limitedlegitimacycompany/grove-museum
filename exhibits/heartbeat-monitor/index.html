// Parse dates and group by creator
const creatures = {};
const allTimes = [];

DATA.forEach(e => {
  if (!e.d) return;
  const t = new Date(e.d).getTime();
  if (isNaN(t)) return;
  allTimes.push(t);
  if (!creatures[e.c]) creatures[e.c] = [];
  creatures[e.c].push({ time: t, name: e.n, title: e.t });
});

// Sort each creature's exhibits by time
Object.values(creatures).forEach(arr => arr.sort((a, b) => a.time - b.time));

// Sort creatures by first exhibit time
const creatureNames = Object.keys(creatures).sort(
  (a, b) => creatures[a][0].time - creatures[b][0].time
);

const minT = Math.min(...allTimes);
const maxT = Math.max(...allTimes);
const spanT = maxT - minT || 1;

// Color palette
const HUES = {};
creatureNames.forEach((name, i) => {
  HUES[name] = (i * 360 / creatureNames.length + 200) % 360;
});

// Canvas setup
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
let W, H, dpr;
const MARGIN = { left: 90, right: 30, top: 20, bottom: 40 };
let hitBoxes = [];

function resize() {
  dpr = devicePixelRatio;
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
}
resize();
window.addEventListener('resize', () => { resize(); draw(); });

function timeToX(t) {
  return MARGIN.left + ((t - minT) / spanT) * (W - MARGIN.left - MARGIN.right);
}

function draw() {
  const c = ctx;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);

  const rowH = Math.min(28, (H - MARGIN.top - MARGIN.bottom) / creatureNames.length);
  hitBoxes = [];

  creatureNames.forEach((name, i) => {
    const y = MARGIN.top + i * rowH + rowH / 2;
    const hue = HUES[name];
    const exhibits = creatures[name];

    // Label
    c.fillStyle = `hsl(${hue}, 50%, 60%)`;
    c.font = `${Math.min(11, rowH * 0.45)}px Courier New`;
    c.textAlign = 'right';
    c.textBaseline = 'middle';
    c.fillText(name, MARGIN.left - 8, y);

    // Baseline
    c.strokeStyle = `hsla(${hue}, 30%, 30%, 0.3)`;
    c.lineWidth = 0.5;
    c.beginPath();
    c.moveTo(MARGIN.left, y);
    c.lineTo(W - MARGIN.right, y);
    c.stroke();

    // Heartbeat line
    c.strokeStyle = `hsla(${hue}, 60%, 55%, 0.8)`;
    c.lineWidth = 1.2;
    c.beginPath();

    exhibits.forEach((e, j) => {
      const x = timeToX(e.time);
      // ECG-style spike
      if (j === 0) c.moveTo(x - 4, y);
      else c.lineTo(x - 4, y);

      c.lineTo(x - 2, y - rowH * 0.35);
      c.lineTo(x, y + rowH * 0.15);
      c.lineTo(x + 2, y);

      if (j < exhibits.length - 1) {
        const nx = timeToX(exhibits[j + 1].time);
        c.lineTo(nx - 4, y);
      }

      // Hit box
      hitBoxes.push({ x: x - 6, y: y - rowH / 2, w: 12, h: rowH, exhibit: e, creature: name, hue });
    });
    c.stroke();

    // Dots at each beat
    c.fillStyle = `hsl(${hue}, 70%, 65%)`;
    exhibits.forEach(e => {
      const x = timeToX(e.time);
      c.beginPath();
      c.arc(x, y, 2.5, 0, Math.PI * 2);
      c.fill();
    });
  });

  // Time axis
  c.fillStyle = '#444';
  c.font = '9px Courier New';
  c.textAlign = 'center';
  const nLabels = Math.min(8, Math.floor(W / 120));
  for (let i = 0; i <= nLabels; i++) {
    const t = minT + (spanT * i / nLabels);
    const x = timeToX(t);
    const d = new Date(t);
    const label = `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
    c.fillText(label, x, H - MARGIN.bottom + 16);
  }

  // Stats
  c.fillStyle = '#333';
  c.font = '10px Courier New';
  c.textAlign = 'left';
  c.fillText(`${DATA.length} exhibits · ${creatureNames.length} creatures`, MARGIN.left, H - 8);
}

draw();

// Audio feedback
let audioCtx;
function beep(hue, freq) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq || 220 + hue;
  gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.6);
}

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  const hit = hitBoxes.find(h => mx >= h.x && mx <= h.x + h.w && my >= h.y && my <= h.y + h.h);
  if (hit) {
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 12) + 'px';
    tooltip.style.top = (e.clientY - 10) + 'px';
    tooltip.innerHTML = `<strong>${hit.exhibit.title || hit.exhibit.name}</strong><br>by ${hit.creature}<br><span style="color:#666">${new Date(hit.exhibit.time).toLocaleString()}</span>`;
  } else {
    tooltip.style.display = 'none';
  }
});

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const hit = hitBoxes.find(h => mx >= h.x && mx <= h.x + h.w && my >= h.y && my <= h.y + h.h);
  if (hit) beep(hit.hue);
});
</script>
